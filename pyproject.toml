[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-office"
version = "0.1.0"
description = "Collector and office view for software-factory events from every repository and machine"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
factory-office = "factory_office.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
